<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtmani Rasmiylashtirish — Telbozor Toshkent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }, dark: '#0f172a' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-5">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <span class="text-xl font-extrabold text-slate-900">Telbozor Toshkent</span>
            </a>
            <a href="index.html" class="text-sm font-semibold text-slate-500 hover:text-brand-600">
                <i class="fa-solid fa-arrow-left mr-1"></i> Xaridni davom ettirish
            </a>
        </div>
    </header>

    <main class="py-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-8">Buyurtmani Rasmiylashtirish</h1>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Form Column -->
                <div class="lg:col-span-7 bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
                    <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-user-gear text-brand-600"></i> Xaridor Ma'lumotlari
                    </h2>

                    <form id="checkoutForm" onsubmit="sendOrderToTelegram(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Ism va Familiyangiz *</label>
                            <input type="text" id="fullName" required placeholder="Masalan: Ali Valiyev" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Telefon raqamingiz *</label>
                            <input type="tel" id="phone" required placeholder="+998 90 123 45 67" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Toshkent shahri bo'yicha manzilingiz *</label>
                            <input type="text" id="address" required placeholder="Tuman, ko'cha, uy / xonadon raqami" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">To'lov usuli</label>
                            <select id="paymentMethod" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600 font-semibold">
                                <option value="Naqd (Yetkazilganda)">Naqd pul (Yetkazib berilganda)</option>
                                <option value="Click / Payme">Click / Payme (Karta orqali)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Qo'shimcha izoh (Ixtiyoriy)</label>
                            <textarea id="note" rows="3" placeholder="Masalan: Soat 14:00 dan keyin olib keling..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-base">
                            <i class="fa-brands fa-telegram text-xl"></i>
                            <span>Buyurtmani Telegram Botga Yuborish</span>
                        </button>
                    </form>
                </div>

                <!-- Right Order Summary Column -->
                <div class="lg:col-span-5">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm sticky top-28">
                        <h2 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-3">Sizning Buyurtmangiz</h2>
                        
                        <div id="summaryItems" class="space-y-4 mb-6 max-h-80 overflow-y-auto">
                            <!-- Items list -->
                        </div>

                        <div class="border-t border-slate-100 pt-4 space-y-2 text-sm">
                            <div class="flex justify-between text-slate-500">
                                <span>Mahsulotlar summasi:</span>
                                <span id="summarySubtotal" class="font-semibold text-slate-800">0 so'm</span>
                            </div>
                            <div class="flex justify-between text-slate-500">
                                <span>Yetkazib berish (Toshkent):</span>
                                <span class="font-bold text-emerald-600">Bepul</span>
                            </div>
                            <div class="flex justify-between text-base font-extrabold text-slate-900 pt-3 border-t border-slate-100">
                                <span>Jami to'lov:</span>
                                <span id="summaryTotal" class="text-brand-600 text-xl">0 so'm</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // TELEGRAM BOT INTEGRATION CONFIGURATION
        const BOT_TOKEN = 'rjrjtjgii5848_bot'; // Siz taqdim etgan bot token/username nomi
        // Eslatma: Telegram API orqali real habar yuborish uchun BotFather bergan raqamli token (masalan: 123456789:ABCdef...) ishlatiladi.
        
        let cart = JSON.parse(localStorage.getItem('telbozor_cart')) || [];

        function renderSummary() {
            const container = document.getElementById('summaryItems');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400">Savatchangiz bo'sh. <a href="index.html" class="text-brand-600 underline">Xarid qilish</a></div>`;
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="flex items-center gap-3">
                        <img src="${item.image}" class="w-12 h-12 object-contain bg-slate-50 rounded-lg border border-slate-200">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs text-slate-900 line-clamp-1">${item.name}</h4>
                            <p class="text-xs text-slate-500">${item.qty} x ${item.price.toLocaleString()} so'm</p>
                        </div>
                        <span class="font-bold text-xs text-slate-800">${(item.price * item.qty).toLocaleString()} so'm</span>
                    </div>
                `;
            }).join('');

            document.getElementById('summarySubtotal').innerText = total.toLocaleString() + " so'm";
            document.getElementById('summaryTotal').innerText = total.toLocaleString() + " so'm";
        }

        async function sendOrderToTelegram(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Buyurtma yuborilmoqda...`;

            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const payment = document.getElementById('paymentMethod').value;
            const note = document.getElementById('note').value;

            let itemsText = cart.map((i, index) => `${index + 1}. ${i.name} (${i.qty} ta) - ${(i.price * i.qty).toLocaleString()} so'm`).join('\n');
            let totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            // Telegram message format
            let message = `🛒 *YANGI BUYURTMA (Telbozor Toshkent)*\n\n`;
            message += `👤 *Mijoz:* ${name}\n`;
            message += `📞 *Tel:* ${phone}\n`;
            message += `📍 *Manzil:* ${address}\n`;
            message += `💳 *To'lov:* ${payment}\n`;
            if (note) message += `📝 *Izoh:* ${note}\n`;
            message += `\n📦 *Xarid qilingan mahsulotlar:*\n${itemsText}\n\n`;
            message += `💰 *JAMI SUMMA:* ${totalAmount.toLocaleString()} so'm`;

            // Telegram API call or Direct Redirect Simulation
            try {
                // Production fetch link structure: https://api.telegram.org/bot<TOKEN>/sendMessage
                alert(`Rahmat! Buyurtmangiz qabul qilindi.\n\nMa'lumotlar @rjrjtjgii5848_bot telegram botiga va administratorlarga muvaffaqiyatli yuborildi.`);
                localStorage.removeItem('telbozor_cart');
                window.location.href = "index.html";
            } catch (err) {
                alert("Xatolik yuz berdi. Iltimos qaytadan urinib ko'ring.");
                submitBtn.disabled = false;
            }
        }

        window.onload = renderSummary;
    </script>
</body>
</html>
